name: Publish NuGet Package

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: publish-nuget-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Publish
    runs-on: "self-hosted"
    env:
      VERSION: ${{ github.ref_name }}

    defaults:
      run:
        shell: cmd

    steps:
    - name: Checkout Commit
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release /p:Version=%VERSION%

    - name: Test
      run: dotnet test --no-build --verbosity normal --configuration Release

    - name: Pack
      run: dotnet pack --output nupkgs --no-restore --no-build --configuration Release /p:PackageVersion=%VERSION%

    # Push the NuGet package to our internal repo
    - name: Push
      run: dotnet nuget push "nupkgs\*.nupkg" --api-key "${{ secrets.NUGET_PUBLISH_API_KEY }}" --source "${{ secrets.NUGET_SOURCE_URL }}"
